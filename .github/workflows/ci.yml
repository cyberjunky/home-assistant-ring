name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate test snapshots and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check custom_components tests
      - run: uvx ruff format --check custom_components tests

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --group test
      - name: Run tests
        if: ${{ !inputs.update_snapshots }}
        run: uv run pytest
      - name: Update snapshots
        if: ${{ inputs.update_snapshots }}
        run: uv run pytest --snapshot-update
      - name: Upload snapshots
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v6
        with:
          name: snapshots
          path: tests/snapshots/
