[project]
name = "home-assistant-ring"
version = "2026.11.0"
description = "Ring custom integration for Home Assistant, using python-ring"
requires-python = ">=3.14.2"
license = { text = "Apache-2.0" }

[dependency-groups]
test = [
    "pytest-homeassistant==2026.11.1",
    "python-ring==0.10.0",
    # camera, stream and ffmpeg dependencies of the ring integration
    "av==19.0.0",
    "ha-ffmpeg==3.2.2",
    "mutagen==1.48.1",
    "numpy==2.3.2",
    "PyTurboJPEG==1.8.3",
]

[tool.pytest.ini_options]
# respx imports httpx before Home Assistant can alias it to httpx2
addopts = "-p no:respx"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.uv]
package = false
